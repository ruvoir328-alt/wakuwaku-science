<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - わくわく物理基礎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mypage.css">
</head>
<body>

  <div class="mypage">

    <header class="mp-hero">
      <a href="index.html" class="mp-back">← ホーム</a>
      <div class="mp-hero-center">
        <h1 class="mp-title">🏅 マイページ</h1>
        <div class="mp-student-id" id="mp-student-id"></div>
      </div>
      <div></div>
    </header>

    <main class="mp-main">

      <!-- ステータスサマリー -->
      <div class="mp-summary" id="mp-summary"></div>

      <!-- 凡例 -->
      <div class="mp-legend">
        <div class="mp-legend-item"><span>🏆</span>全問正解</div>
        <div class="mp-legend-item"><span>🥇</span>メダル（4問以上）</div>
        <div class="mp-legend-item"><span class="legend-empty">⊙</span>未挑戦</div>
      </div>

      <!-- 第1章 -->
      <section class="mp-section">
        <div class="mp-section-header">
          <span class="mp-section-num">第1章</span>
          <h2 class="mp-section-title">直線運動の世界</h2>
        </div>
        <div class="mp-grid" id="mp-grid-1"></div>
      </section>

      <!-- 第2章 -->
      <section class="mp-section">
        <div class="mp-section-header">
          <span class="mp-section-num">第2章</span>
          <h2 class="mp-section-title">力と運動の法則</h2>
        </div>
        <div class="mp-grid" id="mp-grid-2"></div>
      </section>

      <!-- 化学 第1章（化学のドリル chemistry/drill.html の記録） -->
      <section class="mp-section">
        <div class="mp-section-header">
          <span class="mp-section-num">化学 第1章</span>
          <h2 class="mp-section-title">物質の成分と構成元素</h2>
        </div>
        <div class="mp-grid" id="mp-grid-c1"></div>
      </section>

    </main>

    <!-- シミュレーションのミッション（sim/medal.js の記録） -->
    <div class="mp-main">
      <section class="mp-section">
        <div class="mp-section-header mp-sim-head">
          <span class="mp-section-num">シミュ</span>
          <h2 class="mp-section-title">ミッション</h2>
          <span class="mp-sim-count" id="mp-sim-count"></span>
        </div>
        <p class="mp-sim-note">🥇 ミッション2こ　🏆 ミッション全部</p>
        <div class="mp-grid" id="mp-grid-sim"></div>
      </section>
    </div>

    <footer class="mp-footer">
      <button class="mp-csv-btn" id="mp-csv">📥 自分のデータをCSVで保存</button>
      <button class="mp-logout-btn" id="mp-logout">ログアウト</button>
    </footer>

  </div>

  <script>
    // ch：章（教科書の 1編1章・2章）。単元一覧（index.html）と同じ順・同じ名前
    const UNITS = [
      { ch: 1, id: '1-1', name: '速度と時間と変位', formula: 'v = x/t' },
      { ch: 1, id: '1-2', name: '等速直線運動',     formula: 'x = vt' },
      { ch: 1, id: '1-3', name: '等加速度運動',     formula: 'v = v₀ + at' },
      { ch: 1, id: '1-4', name: '自由落下',         formula: 'v = gt' },
      { ch: 1, id: '1-5', name: '鉛直投げおろし',   formula: 'v = v₀ + gt' },
      { ch: 1, id: '1-6', name: '鉛直投げ上げ',     formula: 'v = v₀ − gt' },
      { ch: 1, id: '1-7', name: '合成速度・相対速度', formula: 'v = v₁ + v₂' },
      { ch: 1, id: '1-8', name: '水平投射',         formula: 'x = v₀t・y = ½gt²' },
      { ch: 2, id: '2-1', name: '力の合成・分解',   formula: 'F = F₁ + F₂' },
      { ch: 2, id: '2-2', name: '力のつりあい',     formula: 'ΣF = 0' },
      { ch: 2, id: '2-3', name: '運動方程式',       formula: 'F = ma' },
      { ch: 2, id: '2-4', name: '摩擦力',           formula: "f = μ'N" },
      { ch: 2, id: '2-5', name: '圧力と浮力',       formula: 'P = F/S' },
      { ch: 2, id: '2-6', name: '弾性力',           formula: 'F = kx' },
      { ch: 2, id: '2-7', name: '作用・反作用',     formula: "F' = −F" },
      // 化学（化学のドリル）。soon：まだない単元（できたら消す）
      { ch: 'c1', id: '化1-1', name: '純物質と混合物',   formula: '純物質・混合物' },
      { ch: 'c1', id: '化1-2', name: '分離・精製',       formula: 'ろ過・蒸留', soon: true },
      { ch: 'c1', id: '化1-3', name: '元素と単体',       formula: '元素・単体', soon: true },
      { ch: 'c1', id: '化1-4', name: '同素体',           formula: 'S・C・O・P', soon: true },
      { ch: 'c1', id: '化1-5', name: '成分元素の検出',   formula: '炎色反応', soon: true },
      { ch: 'c1', id: '化1-6', name: '状態変化',         formula: '融解・蒸発…', soon: true },
      { ch: 'c1', id: '化1-7', name: '熱運動と絶対温度', formula: 'T = t + 273' },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const sid = 'guest';
      

      document.getElementById('mp-student-id').textContent = 'ゲストプレイ（記録はこの端末だけに保存されます）';

      document.getElementById('mp-logout').style.display = 'none';

      document.getElementById('mp-csv').addEventListener('click', () => {
        const log = readStore(`wakuwakupub_log_${sid}`, []);
        if (!log.length) { alert('まだ記録がありません。ドリルを完了すると記録されます。'); return; }
        downloadCSV(log, `log_${sid}.csv`);
      });

      // 保存できない端末（localStorage が使えない）では、記録なしとして表示する
      function readStore(key, empty) {
        try { return JSON.parse(localStorage.getItem(key) || 'null') || empty; } catch (e) { return empty; }
      }
      const data = readStore(`wakuwakupub_progress_${sid}`, {});

      // ── サマリー ──
      let cleared = 0, trophies = 0;
      UNITS.forEach(u => {
        if (data[u.id] && data[u.id].bestScore >= 4) {   // メダル（4問以上）でクリア
          cleared++;
          if (data[u.id].perfect) trophies++;
        }
      });
      document.getElementById('mp-summary').innerHTML = `
        <div class="mp-stat">
          <span class="mp-stat-num">${cleared}</span>
          <span class="mp-stat-lbl">/ ${UNITS.length} クリア</span>
        </div>
        <div class="mp-stat-div"></div>
        <div class="mp-stat">
          <span class="mp-stat-icon">🏆</span>
          <span class="mp-stat-num">${trophies}</span>
          <span class="mp-stat-lbl">トロフィー</span>
        </div>
      `;

      // ── CSV ダウンロード ──
      function downloadCSV(entries, filename) {
        const header = ['日時', '学籍番号', 'クラス', 'ユニット', 'ユニット名',
                        'スコア', '満点', 'メダル', 'トロフィー', '初クリア', '初トロフィー'];
        const rows = entries.map(e => [
          e.timestamp, e.studentId, e.classNum, e.unitId, e.unitName,
          e.score, e.total, e.medal, e.trophy, e.firstClear, e.firstTrophy
        ]);
        const csv = [header, ...rows]
          .map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
          .join('\r\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // ── ユニットグリッド ──
      UNITS.forEach(unit => {
        const grid = document.getElementById('mp-grid-' + unit.ch);
        const prog = data[unit.id];
        const perfect = prog && prog.perfect;
        const done    = prog && !perfect && prog.bestScore >= 4;   // メダルは 4問以上

        const card = document.createElement('a');
        const chem = String(unit.ch).startsWith('c');
        card.href = unit.soon ? '../chemistry/units.html'
          : chem ? `../chemistry/drill.html?unit=${encodeURIComponent(unit.id)}` : `drill.html?unit=${unit.id}`;
        card.className = `mp-card ${perfect ? 'mp-perfect' : done ? 'mp-done' : 'mp-new'}`;
        card.innerHTML = `
          <div class="mp-card-icon">
            ${perfect ? '🏆' : done ? '🥇' : '<span class="mp-card-empty">⊙</span>'}
          </div>
          <div class="mp-card-id">${unit.id}</div>
          <div class="mp-card-name">${unit.name}</div>
          <div class="mp-card-formula">${unit.formula}</div>
          <div class="mp-card-score">${prog ? `${prog.bestScore} / 10` : unit.soon ? '準備中' : '未挑戦'}</div>
        `;
        grid.appendChild(card);
      });
    });
  </script>

  <script src="../sim/medal.js"></script>
  <script>
    // シミュのミッション：⊙ まだ／🥇 メダル／🏆 トロフィー（T-31）
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('mp-grid-sim');
      const lv = SimMedal.levels();
      let trophies = 0;
      SimMedal.SIMS.forEach(s => {
        const rec = SimMedal.record(s.id), l = lv[s.id];
        if (l === 'trophy') trophies++;
        const card = document.createElement('a');
        card.href = `../sim/${s.id}.html`;
        card.className = `mp-card ${l === 'trophy' ? 'mp-perfect' : l === 'medal' ? 'mp-done' : 'mp-new'}`;
        card.innerHTML = `
          <div class="mp-card-icon">
            ${l === 'trophy' ? '🏆' : l === 'medal' ? '🥇' : '<span class="mp-card-empty">⊙</span>'}
          </div>
          <div class="mp-card-id">第${s.ep}話</div>
          <div class="mp-card-name">${s.name}</div>
          <div class="mp-card-score">${rec && rec.total ? `ミッション ${SimMedal.count(rec)} / ${rec.total}` : '未挑戦'}</div>
        `;
        grid.appendChild(card);
      });
      document.getElementById('mp-sim-count').textContent = `🏆 ${trophies} / ${SimMedal.SIMS.length}`;
    });
  </script>
</body>
</html>
