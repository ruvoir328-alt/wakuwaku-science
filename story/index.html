<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストーリーモード | わくわく物理基礎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --coat:#22305a;      /* ニュートンくんの上着の紺 */
  --coat-deep:#18223f;
  --wood:#b47a44;      /* 紙芝居の木の舞台 */
  --wood-dark:#7e5129;
  --paper:#ffffff;
  --ink:#1f2638;
  --apple:#d93a3f;
  --leaf:#5e9e4d;
  --muted:#6b7488;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--coat);
  color:var(--ink);
  font-family:'Zen Maru Gothic',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:540px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column;gap:12px}

/* ---- ヘッダー ---- */
.top{display:flex;align-items:center;justify-content:space-between;color:#cfd7ee;font-size:13px}
.top a{color:#cfd7ee;text-decoration:none;padding:6px 0}
.top a:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
.ep-head{color:#fff;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ep-no{font-family:'Dela Gothic One',sans-serif;font-size:15px;color:#ffd6d7;letter-spacing:.04em}
.ep-title{font-weight:900;font-size:19px;line-height:1.35}
.progress{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--apple);transition:width .3s}

/* ---- 紙芝居の舞台 ---- */
.stage{
  background:var(--wood);
  padding:12px 12px 16px;
  border-radius:10px 10px 6px 6px;
  box-shadow:inset 0 0 0 3px var(--wood-dark), 0 10px 0 -4px var(--wood-dark);
  position:relative;
}
.stage::before{ /* 舞台の上の名札 */
  content:'わくわく物理基礎';
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  background:var(--wood-dark);color:#f6e6cf;font-size:11px;font-weight:700;
  padding:3px 12px;border-radius:999px;white-space:nowrap;
}
.deck{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:3px;background:#e9edf3;cursor:pointer}
.card{position:absolute;inset:0;background:var(--paper);overflow:hidden}
.card.leaving{transition:transform .42s cubic-bezier(.55,.05,.7,.4);transform:translateX(-112%) rotate(-1.5deg);z-index:3}
.card svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.chara{position:absolute;bottom:3%;height:64%;width:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08));transition:opacity .2s}
.chara.left{left:1%}
.chara.right{right:1%}
.chara.small{height:54%}
.chara.mini{height:37%}
.chara.quiet{opacity:.82}

/* 紙に描いた文字 */
.paper-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.paper-title .no{font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,9vw,44px);color:var(--apple);line-height:1}
.paper-title .t{font-family:'Dela Gothic One',sans-serif;font-size:clamp(20px,6.4vw,30px);line-height:1.3;color:var(--ink)}
.paper-title .s{font-size:13px;color:var(--muted);font-weight:700}
.tap-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}

.answer-word{position:absolute;top:16%;left:4%;width:58%;text-align:center;font-family:'Dela Gothic One',sans-serif;font-size:clamp(40px,14vw,64px);color:var(--apple);line-height:1}
.answer-sub{position:absolute;top:44%;left:4%;width:58%;text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
.your-guess{position:absolute;top:58%;left:2%;width:62%;text-align:center;font-size:11px;white-space:nowrap;color:var(--muted);background:#f3f5fa;border-radius:999px;padding:4px 8px}

.points{position:absolute;top:5%;left:5%;right:5%;background:#fff7e9;border:2px dashed #e9c48f;border-radius:8px;padding:10px 12px 10px 14px}
.points h3{font-size:13px;font-weight:900;margin-bottom:4px;color:var(--wood-dark)}
.points li{font-size:12.5px;line-height:1.5;margin-left:1.1em}

.replay{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;background:#fff;border:2px solid var(--coat);color:var(--coat);font:700 12px 'Zen Maru Gothic',sans-serif;padding:5px 12px;border-radius:999px;cursor:pointer}
.replay:focus-visible{outline:3px solid var(--apple);outline-offset:2px}

/* ---- セリフ欄 ---- */
.dialog{background:#fff;border-radius:14px;padding:16px 16px 14px;position:relative;min-height:150px;display:flex;flex-direction:column;gap:12px}
.speaker{position:absolute;top:-12px;left:14px;font-size:13px;font-weight:900;color:#fff;background:var(--coat);padding:3px 12px;border-radius:999px}
.speaker.rika{background:#a8343b}
.speaker:empty{display:none}
.line{font-size:17px;line-height:1.75;font-weight:700;min-height:3.5em}
.line .math{font-family:'Times New Roman',serif;font-style:italic;font-weight:400}
.choices{display:grid;gap:8px}
.choice{font:700 16px 'Zen Maru Gothic',sans-serif;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid #cfd6e6;background:#f6f8fc;color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--coat)}
.choice:focus-visible{outline:3px solid var(--apple);outline-offset:2px}
.choice[aria-pressed="true"]{border-color:var(--apple);background:#fff1f1}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.btn{font:700 15px 'Zen Maru Gothic',sans-serif;border-radius:999px;padding:10px 20px;cursor:pointer;border:2px solid transparent}
.btn:focus-visible{outline:3px solid var(--apple);outline-offset:2px}
.btn-next{background:var(--coat);color:#fff}
.btn-back{background:transparent;color:var(--muted);padding-left:4px}
.btn[disabled]{opacity:.35;cursor:default}
.ends{display:grid;gap:8px}
.ends a,.ends button{display:block;text-align:center;text-decoration:none;font:700 15px 'Zen Maru Gothic',sans-serif;padding:12px;border-radius:12px;cursor:pointer;border:2px solid var(--coat)}
.ends .go{background:var(--apple);border-color:var(--apple);color:#fff}
.ends .soon{background:#f1f3f8;color:var(--muted);border-color:#e1e5ee;cursor:default}
.ends .again{background:#fff;color:var(--coat)}

@media (prefers-reduced-motion: reduce){
  .card.leaving{transition:none}
  .progress span{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="../">← わくわくサイエンス</a>
    <span id="chapter"></span>
  </div>
  <div class="ep-head"><span class="ep-no" id="epNo"></span><h1 class="ep-title" id="epTitle"></h1></div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

  <div class="stage">
    <div class="deck" id="deck" role="img" aria-label="紙芝居の絵"></div>
  </div>

  <div class="dialog" aria-live="polite">
    <div class="speaker" id="speaker"></div>
    <p class="line" id="line"></p>
    <div class="choices" id="choices"></div>
    <div class="nav">
      <button class="btn btn-back" id="back">もどる</button>
      <button class="btn btn-next" id="next">つぎへ</button>
    </div>
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const epId = (params.get('ep') || '06').replace(/\D/g,'');
  const s = document.createElement('script');
  s.src = 'ep' + epId + '.js';
  s.onload = () => start(window.EPISODE);
  s.onerror = () => { document.getElementById('line').textContent = 'このお話はまだ準備中です。'; };
  document.head.appendChild(s);
})();

const NAMES = { newton:'ニュートンくん', rika:'リカ' };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

function start(EP){
  let i = 0, busy = false, anim = null;
  const answers = {};
  $('chapter').textContent = EP.chapter;
  $('epNo').textContent = '第' + Number(EP.id) + '話';
  $('epTitle').textContent = EP.title;
  document.title = '第' + Number(EP.id) + '話 ' + EP.title + ' | わくわく物理基礎';

  // 画像を先に読み込んでおく
  EP.scenes.forEach(sc => (sc.chars||[]).forEach(c => { new Image().src = img(c.who, c.face); }));

  function img(who, face){ return 'img/' + who + '_' + face + '.webp'; }

  function buildCard(sc){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = SCENES[sc.bg] ? SCENES[sc.bg](sc, EP, answers) : '';
    let chars = (sc.chars || []).map(c => Object.assign({}, c));
    const br = branchOf(sc);
    if (br && br.face) chars.forEach(c => { if (c.who === sc.speaker) c.face = br.face; });
    if (sc.reveal){
      const ok = answers[sc.reveal] === findChoice(sc.reveal).answer;
      chars = [{ who:'newton', face: ok ? sc.right.face : sc.wrong.face, side:'right' }];
    }
    const small = ['tube','tube-vacuum','tube-air','strobe','formula'].includes(sc.bg);
    const mini = sc.bg === 'end';
    chars.forEach(c => {
      const im = document.createElement('img');
      im.src = img(c.who, c.face);
      im.alt = NAMES[c.who];
      im.className = 'chara ' + c.side + (small ? ' small' : '') + (mini ? ' mini' : '') + (sc.speaker && sc.speaker !== c.who ? ' quiet' : '');
      card.appendChild(im);
    });
    return card;
  }

  // 予想（choice）で選んだものによってセリフと表情を変える
  function branchOf(sc){
    if (!sc.byChoice) return null;
    return sc.byChoice.options[answers[sc.byChoice.id]] || null;
  }

  function findChoice(id){ return EP.scenes.find(x => x.choice && x.choice.id === id).choice; }

  function render(dir){
    const sc = EP.scenes[i];
    const deck = $('deck');
    const old = deck.querySelector('.card:not(.leaving)');
    const card = buildCard(sc);
    deck.insertBefore(card, deck.firstChild);
    if (old){
      if (dir > 0 && !reduce){
        busy = true;
        requestAnimationFrame(() => old.classList.add('leaving'));
        setTimeout(() => { old.remove(); busy = false; }, 440);
      } else old.remove();
    }
    if (anim) { cancelAnimationFrame(anim.raf); anim = null; }
    if (sc.bg === 'tube-vacuum' || sc.bg === 'tube-air') setupDrop(card, sc.bg === 'tube-air');

    // セリフ
    let text = sc.text || '', speaker = sc.speaker || '';
    const br = branchOf(sc);
    if (br) text = br.text;
    if (sc.reveal){
      const ok = answers[sc.reveal] === findChoice(sc.reveal).answer;
      text = ok ? sc.right.text : sc.wrong.text; speaker = 'newton';
    }
    if (sc.bg === 'title') text = 'タップしてはじめよう';
    $('speaker').textContent = speaker ? NAMES[speaker] : '';
    $('speaker').className = 'speaker ' + speaker;
    $('line').innerHTML = esc(text);

    // 選択肢
    const box = $('choices'); box.innerHTML = '';
    if (sc.choice){
      sc.choice.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'choice'; b.textContent = o.label;
        b.setAttribute('aria-pressed', answers[sc.choice.id] === o.key ? 'true' : 'false');
        b.onclick = () => { answers[sc.choice.id] = o.key; go(1); };
        box.appendChild(b);
      });
    }
    if (sc.end){
      const wrap = document.createElement('div'); wrap.className = 'ends';
      wrap.innerHTML =
        '<a class="go" href="' + EP.drillUrl + '">チャレンジモードで計算する</a>' +
        '<button class="soon" disabled>シミュレーションモード（準備中）</button>' +
        '<button class="again" id="again">最初から見る</button>';
      box.appendChild(wrap);
      $('again').onclick = () => { i = 0; Object.keys(answers).forEach(k => delete answers[k]); render(1); };
    }
    $('back').disabled = i === 0;
    $('next').style.visibility = (sc.choice && !answers[sc.choice.id]) || sc.end ? 'hidden' : 'visible';
    $('next').textContent = sc.bg === 'title' ? 'はじめる' : 'つぎへ';
    $('bar').style.width = (i / (EP.scenes.length - 1) * 100) + '%';
  }

  function go(d){
    if (busy) return;
    const sc = EP.scenes[i];
    if (d > 0 && sc.choice && !answers[sc.choice.id]) return;
    if (d > 0 && sc.end) return;
    const n = i + d;
    if (n < 0 || n >= EP.scenes.length) return;
    i = n; render(d);
  }

  $('next').onclick = () => go(1);
  $('back').onclick = () => go(-1);
  $('deck').addEventListener('click', e => { if (!e.target.closest('.replay')) go(1); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('button,a')) return;
    if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') go(-1);
  });

  // 真空・空気ありの落下アニメーション
  function setupDrop(card, air){
    const ball = card.querySelector('#ball'), feather = card.querySelector('#feather');
    const btn = document.createElement('button');
    btn.className = 'replay'; btn.textContent = 'もう一度落とす';
    card.appendChild(btn);
    const TOP = 62, FALL = 172, T = 1.1;   // 筒の中で172px を1.1秒で落ちる
    const k = 2 * FALL / (T * T);
    function frame(t0){
      return now => {
        const t = Math.max(0, (now - t0) / 1000 - 0.35);
        const yb = Math.min(FALL, 0.5 * k * t * t);
        let yf, xf = 0;
        if (air){
          const vt = 34;                           // 羽根の終端速度（px/s）
          yf = Math.min(FALL, vt * t + 1);
          xf = Math.sin(t * 4) * 7;
        } else yf = yb;
        ball.setAttribute('transform', 'translate(0,' + yb + ')');
        feather.setAttribute('transform', 'translate(' + xf + ',' + yf + ')');
        if (yb < FALL || yf < FALL) anim.raf = requestAnimationFrame(frame(t0));
      };
    }
    function play(){
      if (anim) cancelAnimationFrame(anim.raf);
      anim = { raf: 0 };
      if (reduce){ ball.setAttribute('transform','translate(0,'+FALL+')'); feather.setAttribute('transform','translate(0,'+(air?40:FALL)+')'); return; }
      anim.raf = requestAnimationFrame(frame(performance.now()));
    }
    btn.onclick = e => { e.stopPropagation(); play(); };
    setTimeout(play, reduce ? 0 : 420);
  }

  render(0);
}

function esc(t){ return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---- 舞台の絵 ---- */
const SKY = '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe2f6"/><stop offset="1" stop-color="#e9f6fc"/></linearGradient></defs>';
function tubeSVG(label, animated){
  const ball = '<g id="ball"><circle cx="186" cy="62" r="10" fill="#59616f"/><circle cx="182" cy="58" r="3" fill="#9aa3b1"/></g>';
  const feather = '<g id="feather"><path d="M214 50 q12 10 2 26 q-8 -6 -8 -14 q0 -8 6 -12z" fill="#f4f1e8" stroke="#b9b29c" stroke-width="1.2"/><path d="M214 50 L214 80" stroke="#b9b29c" stroke-width="1"/></g>';
  return '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true">' +
    '<rect width="400" height="300" fill="#eef2f7"/><rect y="252" width="400" height="48" fill="#d6dce6"/>' +
    '<rect x="166" y="34" width="68" height="216" rx="14" fill="rgba(190,225,250,.45)" stroke="#86aac4" stroke-width="3"/>' +
    '<rect x="160" y="28" width="80" height="12" rx="4" fill="#9aa9b8"/><rect x="160" y="244" width="80" height="12" rx="4" fill="#9aa9b8"/>' +
    '<rect x="174" y="44" width="6" height="190" rx="3" fill="rgba(255,255,255,.6)"/>' +
    (label ? '<text x="200" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#4b5568" font-family="Zen Maru Gothic">' + label + '</text>' : '') +
    ball + feather + '</svg>';
}
const SCENES = {
  title: (sc, EP) =>
    '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true"><rect width="400" height="300" fill="#fff"/>' +
    '<circle cx="340" cy="62" r="18" fill="#d93a3f"/><path d="M340 44 q4 -10 12 -12" stroke="#7e5129" stroke-width="3" fill="none"/><ellipse cx="354" cy="38" rx="9" ry="5" fill="#5e9e4d" transform="rotate(-25 354 38)"/>' +
    '<path d="M60 250 h280" stroke="#e8d3b4" stroke-width="2" stroke-dasharray="6 6"/></svg>' +
    '<div class="paper-title"><div class="no">第' + Number(EP.id) + '話</div><div class="t">' + EP.title + '</div><div class="s">' + EP.chapter + '　' + EP.topic + '</div></div>' +
    '<div class="tap-hint">絵をタップすると、紙芝居が進むよ</div>',
  orchard: () =>
    '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true">' + SKY + '<rect width="400" height="300" fill="url(#sky)"/>' +
    '<ellipse cx="90" cy="250" rx="220" ry="60" fill="#a9d38a"/><ellipse cx="330" cy="260" rx="200" ry="55" fill="#98c878"/>' +
    '<rect y="250" width="400" height="50" fill="#86bb66"/>' +
    '<path d="M192 250 q-4 -60 4 -110 h16 q6 50 2 110z" fill="#8a5a35"/>' +
    '<circle cx="204" cy="104" r="66" fill="#5e9e4d"/><circle cx="158" cy="122" r="40" fill="#69a957"/><circle cx="250" cy="120" r="42" fill="#69a957"/>' +
    '<circle cx="176" cy="96" r="8" fill="#d93a3f"/><circle cx="232" cy="84" r="8" fill="#d93a3f"/><circle cx="214" cy="132" r="8" fill="#d93a3f"/><circle cx="160" cy="138" r="7" fill="#d93a3f"/><circle cx="258" cy="128" r="7" fill="#d93a3f"/></svg>',
  tube: () => tubeSVG('真空の筒'),
  'tube-vacuum': () => tubeSVG('真空（空気なし）'),
  'tube-air': () => tubeSVG('空気あり'),
  strobe: () => {
    // 0.1秒ごとの位置 y = 1/2 g t^2（0〜0.5秒、1.225m を 200px に）
    let balls = '', ticks = '';
    for (let n = 0; n <= 5; n++){
      const t = n * 0.1, y = 40 + (0.5 * 9.8 * t * t) / 1.225 * 200;
      balls += '<circle cx="200" cy="' + y.toFixed(1) + '" r="9" fill="#f2f4f8" opacity="' + (0.55 + n * 0.09).toFixed(2) + '"/>';
      if (n !== 1) ticks += '<text x="244" y="' + (y + 4).toFixed(1) + '" font-size="11" fill="#ffd6d7" font-family="Zen Maru Gothic">' + t.toFixed(1) + '秒</text>';
      ticks += '<line x1="226" x2="238" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#ffd6d7" stroke-width="2"/>';
    }
    return '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true"><rect width="400" height="300" fill="#1f2a4a"/>' +
      '<line x1="232" x2="232" y1="34" y2="246" stroke="#ffd6d7" stroke-width="1.5" opacity=".6"/>' + balls + ticks +
      '<text x="200" y="278" text-anchor="middle" font-size="13" fill="#cfd7ee" font-family="Zen Maru Gothic" font-weight="700">0.1秒ごとに写した鉄球</text></svg>';
  },
  formula: () =>
    '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true"><rect width="400" height="300" fill="#eef2f7"/>' +
    '<rect x="150" y="36" width="232" height="196" rx="8" fill="#2f5b4e" stroke="#7e5129" stroke-width="8"/>' +
    '<text x="266" y="88" text-anchor="middle" font-size="24" fill="#fff" font-family="Times New Roman" font-style="italic">g = 9.8 m/s²</text>' +
    '<line x1="186" x2="346" y1="108" y2="108" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>' +
    '<text x="266" y="150" text-anchor="middle" font-size="26" fill="#fff" font-family="Times New Roman" font-style="italic">v = gt</text>' +
    '<text x="266" y="200" text-anchor="middle" font-size="26" fill="#fff" font-family="Times New Roman" font-style="italic">y = ½gt²</text>' +
    '<rect y="252" width="400" height="48" fill="#d6dce6"/></svg>',
  answer: (sc, EP, answers) => {
    const ch = EP.scenes.find(x => x.choice && x.choice.id === sc.reveal).choice;
    const mine = ch.options.find(o => o.key === answers[sc.reveal]);
    const right = ch.options.find(o => o.key === ch.answer);
    return '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true"><rect width="400" height="300" fill="#fff"/></svg>' +
      '<div class="answer-word">' + right.label.replace('に落ちる','') + '！</div>' +
      '<div class="answer-sub">真空の中では</div>' +
      '<div class="your-guess">あなたの予想：' + (mine ? mine.label : '—') + '</div>';
  },
  end: (sc) =>
    '<svg class="scene" viewBox="0 0 400 300" aria-hidden="true">' + SKY + '<rect width="400" height="300" fill="url(#sky)"/><rect y="250" width="400" height="50" fill="#86bb66"/></svg>' +
    '<div class="points"><h3>今日のポイント</h3><ul>' + sc.points.map(p => '<li>' + p + '</li>').join('') + '</ul></div>'
};
</script>
</body>
</html>
